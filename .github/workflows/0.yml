# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "0"
on:
  workflow_dispatch:
    inputs:
      audience:
        type: "string"
        description: "Audience."
        required: true
jobs:
  main:
    permissions:
      id-token: "write"
    runs-on: "ubuntu-latest"
    steps:
      - shell: "pwsh"
        env:
          INPUT_AUDIENCE: "${{inputs.audience}}"
        run: |-
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $True
          $JWT = Invoke-RestMethod -Uri "$($Env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=$($Env:INPUT_AUDIENCE)" -Headers @{ Authorization = "Bearer $($Env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)" } -Method 'Get'
          Invoke-RestMethod -Uri 'https://codeberg.org/api/v1/user' -Headers @{ Authorization = "Bearer $($JWT.value)" } -Method 'Get'
